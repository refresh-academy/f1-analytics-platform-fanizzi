services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: f1_analytics
      POSTGRES_USER: f1_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:13.3.0
    # Make the web interface available only on this computer.
    ports:
      - "127.0.0.1:3000:3000"
    # Keep Grafana settings and future dashboards across container restarts.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:4.2.2
    # Kafka starts only when the streaming profile is selected.
    profiles: [streaming]
    hostname: kafka
    # Publish only the host-facing port, and only on this Mac.
    # The internal client and controller ports stay on the Compose network.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # One node performs both broker and controller roles (KRaft, no ZooKeeper).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      # A listener accepts connections; its advertised address tells clients
      # where to connect after they request broker metadata.
      # Python on the Mac uses localhost:9092; future Docker services
      # such as Spark will use kafka:19092.
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Kafka's internal topics cannot request multiple replicas when
      # this learning environment has only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Store Kafka records and KRaft metadata in the named volume below.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "x7r6MPZfSUyw9auOT6BBLA"
      # Limit the Java heap initially; we will measure total memory after startup.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - kafka_data:/var/lib/kafka/data

  spark:
    image: apache/spark:4.2.1-scala2.13-java17-python3-ubuntu
    # Run Spark jobs explicitly, separately from the daily service startup.
    profiles: [processing]
    # Limit the whole container; the Java heap below is only part of its memory.
    mem_limit: 1536m
    cpus: 1.0
    environment:
      # Driver and Python workers run together inside this local-mode container.
      SPARK_LOCAL_IP: "127.0.0.1"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      # Application code is editable on the Mac and read-only inside Spark.
      - ./src/streaming:/opt/spark/app:ro
      # Reuse downloaded dependencies and retain query checkpoints between runs.
      # This existing image directory is owned by the unprivileged spark user.
      - spark_state:/opt/spark/work-dir
    entrypoint:
      - /opt/spark/bin/spark-submit
      # A single local thread is sufficient for the initial 647-event sample.
      - --master
      - local[1]
      - --driver-memory
      - 512m
      - --conf
      - spark.ui.enabled=false
      - --conf
      - spark.sql.shuffle.partitions=1
      - --conf
      - spark.default.parallelism=1
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/ivy
      # Match both the Scala binary version and Spark version of the image.
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1
    # Until an application is specified, only display the runtime version.
    command: ["--version"]

volumes:
  postgres_data:
  grafana_data:
  kafka_data:
  spark_state:
