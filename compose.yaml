services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: f1_analytics
      POSTGRES_USER: f1_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
