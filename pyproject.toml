[project]
name = "f1-analytics-platform-fanizzi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastf1",
    "kafka-python>=3.0.12",
    "pandas",
    "psycopg[binary]>=3.3.6",
    "pyarrow",
    "requests>=2.34.2",
]

[tool.uv]
# Keep cryptography compatible with Intel-based macOS systems.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
